<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jarvis logo">
  <defs>
    <linearGradient id="ringL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ring2L" x1="1" y1="0" x2="0" y2="1">
