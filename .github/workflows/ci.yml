name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System audio library
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run pytest -q -p no:warnings --cov=jarvis --cov-fail-under=80
