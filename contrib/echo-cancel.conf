# ~/.config/pipewire/pipewire.conf.d/echo-cancel.conf
# Adds an "Echo-Cancel Source" that removes speaker output from the mic signal.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      node.latency = 1024/48000
      capture.props  = { node.name = "Echo-Cancel Capture" }
      source.props   = { node.name = "echo-cancel-source" node.description = "Echo-Cancel Source" }
      sink.props     = { node.name = "echo-cancel-sink"   node.description = "Echo-Cancel Sink" }
      playback.props = { node.name = "Echo-Cancel Playback" }
    }
  }
]
