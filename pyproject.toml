[project]
name = "jarvis-voice"
version = "0.2.0"
description = "A voice assistant for Linux that runs fully offline (Whisper + Ollama + Piper) or on the Gemini Live API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jarvis-voice contributors" }]
requires-python = ">=3.11,<3.13"
keywords = ["voice-assistant", "linux", "ollama", "whisper", "piper", "gemini", "hyprland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "python-dotenv>=1.0",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
# Pick a brain. `local` is the private one; `gemini` sends audio to Google (testing only).
local = [
    "faster-whisper>=1.2.1",
    "openai>=3.46.0",
    "piper-tts>=1.8.0",
]
gemini = ["google-genai>=1.20"]
wakeword = ["openwakeword>=0.6"]
all = ["jarvis-voice[local,gemini,wakeword]"]

[project.scripts]
jarvis = "jarvis.__main__:main"


[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.uv]
# openWakeWord pins tflite-runtime on Linux, which has no wheels past CPython 3.11.
# We run its ONNX backend instead, so drop tflite entirely.
override-dependencies = ["tflite-runtime; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
